<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | TreasuresGod</title><style>body{font-family:Arial;background:#f5f7fb;margin:0}.wrap{max-width:1200px;margin:auto;padding:25px}.box{background:#fff;padding:20px;margin:15px 0;border-radius:12px}input,button,select{padding:9px;margin:5px}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #ddd;text-align:left}button{cursor:pointer}</style></head><body><div class="wrap"><h1>Administración TreasuresGod</h1><div id="login" class="box"><input id="pw" type="password" placeholder="Contraseña"><button onclick="login()">Ingresar</button><p id="lm"></p></div><div id="dash" style="display:none"><div class="box"><h2>Eventos</h2><form id="ef"><input type="hidden" name="id"><input name="name" placeholder="Nombre" required><input name="date" type="date" required><input name="time" type="time" required><input name="location" placeholder="Lugar" required><input name="capacity" type="number" placeholder="Cupos" required><input name="price" type="number" step="0.01" placeholder="Precio"><button>Guardar evento</button><button type="button" onclick="clearForm()">Nuevo</button></form><div id="events"></div></div><div class="box"><h2>Inscripciones</h2><div id="regs"></div></div><button onclick="logout()">Cerrar sesión</button></div></div><script>async function login(){const r=await fetch('/api/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({password:pw.value})});if(r.ok){loginBox(false);load()}else lm.textContent='Contraseña incorrecta'}function loginBox(x){login.style.display=x?'block':'none';dash.style.display=x?'none':'block'}async function load(){const r=await fetch('/api/admin');if(r.status===401){loginBox(true);return}const d=await r.json();events.innerHTML=d.events.map(e=>`<div>${e.name} — ${e.date} — S/ ${e.price} <button onclick='edit(${JSON.stringify(e)})'>Editar</button><button onclick="delEvent('${e.id}')">Eliminar</button></div>`).join('');regs.innerHTML='<table><tr><th>Código</th><th>Nombre</th><th>Evento</th><th>Pago</th><th>Acción</th></tr>'+d.registrations.map(x=>`<tr><td>${x.code}</td><td>${x.name}</td><td>${x.eventName}</td><td><select onchange="status('${x.code}',this.value)"><option ${x.paymentStatus==='Pendiente'?'selected':''}>Pendiente</option><option ${x.paymentStatus==='Pagado'?'selected':''}>Pagado</option></select></td><td><button onclick="delReg('${x.code}')">Eliminar</button></td></tr>`).join('')+'</table>'}function edit(e){Object.entries(e).forEach(([k,v])=>{const el=document.querySelector(`[name=${k}]`);if(el)el.value=v})}function clearForm(){ef.reset();document.querySelector('[name=id]').value=''}ef.onsubmit=async ev=>{ev.preventDefault();const b=Object.fromEntries(new FormData(ef));b.capacity=Number(b.capacity);b.price=Number(b.price);const method=b.id?'PUT':'POST';const r=await fetch('/api/events',{method,headers:{'content-type':'application/json'},body:JSON.stringify(b)});if(r.ok){clearForm();load()}else alert((await r.json()).error||'Error')};async function status(code,paymentStatus){await fetch('/api/admin',{method:'PATCH',headers:{'content-type':'application/json'},body:JSON.stringify({code,paymentStatus})});}async function delReg(code){if(confirm('¿Eliminar inscripción?')){await fetch('/api/admin?code='+encodeURIComponent(code),{method:'DELETE'});load()}}async function delEvent(id){if(confirm('¿Eliminar evento?')){await fetch('/api/events?id='+encodeURIComponent(id),{method:'DELETE'});load()}}async function logout(){await fetch('/api/logout',{method:'POST'});loginBox(true)}loginBox(true);</script></body></html>

<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TreasuresGod | Eventos deportivos</title><style>body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#172033}header{background:#111827;color:white;padding:22px 6%;display:flex;justify-content:space-between;align-items:center}header b{font-size:25px}a{color:inherit;text-decoration:none}.hero{padding:60px 6%;background:linear-gradient(135deg,#111827,#334155);color:white}.hero h1{font-size:44px;margin:0 0 10px}.wrap{max-width:1150px;margin:auto;padding:35px 20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(270px,1fr));gap:20px}.card{background:white;border-radius:16px;padding:22px;box-shadow:0 8px 25px #0001}.btn{display:inline-block;background:#2563eb;color:white;padding:12px 18px;border-radius:10px;border:0;cursor:pointer;margin-top:10px}.muted{color:#64748b}</style></head><body><header><b>🏆 TreasuresGod</b><a href="/admin.html">Administración</a></header><section class="hero"><h1>Eventos deportivos</h1><p>Participa, compite y vive la experiencia TreasuresGod.</p></section><main class="wrap"><h2>Próximos eventos</h2><div id="events" class="grid">Cargando...</div></main><script>fetch('/api/events').then(r=>r.json()).then(es=>{events.innerHTML=es.map(e=>`<article class="card"><h3>${e.name}</h3><p>${e.description||''}</p><p>📅 ${e.date} · ⏰ ${e.time}</p><p>📍 ${e.location}</p><p>👥 Capacidad: ${e.capacity}</p><p>💰 S/ ${e.price}</p><a class="btn" href="/registro.html?evento=${encodeURIComponent(e.id)}">Inscribirme</a></article>`).join('')})</script></body></html>

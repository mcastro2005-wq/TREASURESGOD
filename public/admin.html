<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | TreasuresGod</title><style>body{font-family:Arial;background:#f5f7fb;margin:0}.wrap{max-width:1200px;margin:auto;padding:25px}.box{background:#fff;padding:20px;margin:15px 0;border-radius:12px}input,button,select{padding:9px;margin:5px}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #ddd;text-align:left}button{cursor:pointer}.photo-preview{width:130px;height:80px;object-fit:cover;border-radius:8px;vertical-align:middle;margin:5px}.event-row{padding:10px 0;border-bottom:1px solid #eee}.hint{color:#667;font-size:13px}</style><style>.site-footer{margin-top:40px;padding:24px 20px;text-align:center;background:#101827;color:#fff;font-size:14px;line-height:1.6}.site-footer strong{letter-spacing:.4px}.site-footer span{opacity:.8}</style></head><body><div class="wrap"><h1>Administración TreasuresGod</h1><div id="login" class="box"><input id="pw" type="password" placeholder="Contraseña"><button onclick="doLogin()">Ingresar</button><p id="lm"></p></div><div id="dash" style="display:none"><div class="box"><h2>Eventos</h2><form id="ef" enctype="multipart/form-data"><input type="hidden" name="id"><input name="name" placeholder="Nombre" required><input name="date" type="date" required><input name="time" type="time" required title="Hora de inicio"><input name="timeEnd" type="time" required title="Hora final"><input name="location" placeholder="Lugar" required><input name="capacity" type="number" placeholder="Cupos" required><input name="price" type="number" step="0.01" placeholder="Precio"><div><label>Foto del evento: <input name="photo" type="file" accept="image/jpeg,image/png,image/webp"></label><span class="hint">Máximo 5 MB</span></div><button>Guardar evento</button><button type="button" onclick="clearForm()">Nuevo</button></form><div id="events"></div></div><div class="box"><h2>Inscripciones</h2><div id="regs"></div></div><button onclick="logout()">Cerrar sesión</button></div></div><script>const loginPanel=document.getElementById("login"),dashPanel=document.getElementById("dash"),pwInput=document.getElementById("pw"),lmMsg=document.getElementById("lm"),ef=document.getElementById("ef"),eventsBox=document.getElementById("events"),regsBox=document.getElementById("regs"); async function doLogin(){const r=await fetch('/api/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({password:pwInput.value})});if(r.ok){loginBox(false);load()}else lmMsg.textContent='Contraseña incorrecta'}function loginBox(showLogin){loginPanel.style.display=showLogin?'block':'none';dashPanel.style.display=showLogin?'none':'block';if(showLogin)pwInput.focus()}async function load(){const r=await fetch('/api/admin');if(r.status===401){loginBox(true);return}const d=await r.json();eventsBox.innerHTML=d.events.map(e=>`<div class="event-row">${e.photoKey?`<img class="photo-preview" src="/api/event-photo?event=${encodeURIComponent(e.id)}">`:''}<strong>${e.name}</strong> — ${e.date} — ${e.time || ""} a ${e.timeEnd || ""} — S/ ${Number(e.price).toFixed(2)} <button onclick='edit(${JSON.stringify(e)})'>Editar</button><button onclick="delEvent('${e.id}')">Eliminar</button></div>`).join('');regsBox.innerHTML='<table><tr><th>Código</th><th>Nombre</th><th>Edad</th><th>Nivel</th><th>Evento</th><th>Pago</th><th>Comprobante</th><th>Acción</th></tr>'+d.registrations.map(x=>`<tr><td>${x.code}</td><td>${x.name}</td><td>${x.age ?? "—"}</td><td>${x.level ?? "—"}</td><td>${x.eventName}</td><td><select onchange="status('${x.code}',this.value)"><option ${x.paymentStatus==='Pendiente'?'selected':''}>Pendiente</option><option ${x.paymentStatus==='Pagado'?'selected':''}>Pagado</option></select></td><td>${x.hasReceipt?`<a href="/api/receipt?code=${encodeURIComponent(x.code)}" target="_blank">Ver</a>`:'—'}</td><td><button onclick="delReg('${x.code}')">Eliminar</button></td></tr>`).join('')+'</table>'}function edit(e){Object.entries(e).forEach(([k,v])=>{const el=document.querySelector(`[name="${k}"]`);if(el && k!=='photo')el.value=v});document.querySelector('[name=id]').value=e.id;window.scrollTo({top:0,behavior:'smooth'})}function clearForm(){ef.reset();document.querySelector('[name=id]').value=''}ef.onsubmit=async ev=>{ev.preventDefault();const fd=new FormData(ef);const id=fd.get('id');const b={id,name:fd.get('name'),date:fd.get('date'),time:fd.get('time'),timeEnd:fd.get('timeEnd'),location:fd.get('location'),capacity:Number(fd.get('capacity')),price:Number(fd.get('price')||0)};const method=id?'PUT':'POST';const r=await fetch('/api/events',{method,headers:{'content-type':'application/json'},body:JSON.stringify(b)});if(!r.ok){alert((await r.json()).error||'Error');return}const saved=await r.json();const photo=fd.get('photo');if(photo && photo.size){const pf=new FormData();pf.append('photo',photo);const pr=await fetch('/api/event-photo?event='+encodeURIComponent(saved.id),{method:'POST',body:pf});if(!pr.ok){let msg='No se pudo subir la foto';try{msg=(await pr.json()).error||msg}catch{}alert(msg);return}}clearForm();await load();alert('Evento guardado correctamente')};async function status(code,paymentStatus){await fetch('/api/admin',{method:'PATCH',headers:{'content-type':'application/json'},body:JSON.stringify({code,paymentStatus})})}async function delReg(code){if(confirm('¿Eliminar inscripción?')){await fetch('/api/admin?code='+encodeURIComponent(code),{method:'DELETE'});load()}}async function delEvent(id){if(confirm('¿Eliminar evento?')){await fetch('/api/events?id='+encodeURIComponent(id),{method:'DELETE'});load()}}async function logout(){await fetch('/api/logout',{method:'POST'});loginBox(true)}loginBox(true);</script><footer class="site-footer"><strong>TREASURESGOD SPORTING VOLEY CLUB®</strong><br><span>Marca registrada · © 2026</span></footer></body></html>

<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QR de TreasuresGod</title><style>body{font-family:Arial;margin:0;background:#f5f7fb;color:#172033;text-align:center}.wrap{max-width:600px;margin:40px auto;padding:25px}.box{background:#fff;padding:28px;border-radius:14px;box-shadow:0 3px 14px #0001}#qrcode{display:flex;justify-content:center;margin:25px 0}button,a{background:#0b6bcb;color:#fff;border:0;padding:11px 16px;border-radius:8px;text-decoration:none;cursor:pointer;margin:5px}.muted{color:#667}.site-footer{margin-top:40px;padding:24px 20px;background:#0b6bcb;color:#fff;font-size:14px;line-height:1.6}.site-footer strong{letter-spacing:.4px}.site-footer span{opacity:.8}</style><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script></head><body><div class="wrap"><div class="box"><h1>TREASURESGOD</h1><h2>QR de la web</h2><p class="muted">Escanea este código para abrir la página principal.</p><div id="qrcode"></div><p id="url"></p><button id="download">⬇️ Descargar QR</button><button onclick="copyLink()">🔗 Copiar enlace</button><a href="/admin.html">Volver a administración</a></div></div><footer class="site-footer"><strong>TREASURESGOD SPORTING VOLEY CLUB®</strong><br><span>TREASURESGOD · © 2026</span></footer><script>const url=location.origin;document.getElementById('url').textContent=url;new QRCode(document.getElementById('qrcode'),{text:url,width:280,height:280,correctLevel:QRCode.CorrectLevel.H});document.getElementById('download').onclick=()=>{const img=document.querySelector('#qrcode img');const canvas=document.querySelector('#qrcode canvas');const href=img?.src||canvas?.toDataURL('image/png');if(!href)return;const a=document.createElement('a');a.href=href;a.download='treasuresgod-QR-web.png';a.click()};function copyLink(){navigator.clipboard?.writeText(url).then(()=>alert('Enlace copiado: '+url)).catch(()=>prompt('Copia este enlace:',url))}</script></body></html>

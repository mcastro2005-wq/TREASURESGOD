<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lista de inscritos | TreasuresGod</title><style>*{box-sizing:border-box}body{font-family:Arial;margin:0;background:#f5f7fb;color:#172033}header{background:linear-gradient(135deg,#0759a8,#0b6bcb);color:#fff;padding:24px 20px}header>div,main{max-width:900px;margin:auto}main{padding:24px 20px}.box{background:#fff;border-radius:14px;padding:20px;box-shadow:0 3px 14px #0001}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:13px 10px;text-align:left;border-bottom:1px solid #e5e7eb}.table th{background:#f0f2f5;font-weight:700}.table tr:hover td{background:#fafafa}.muted{color:#667}.btn{background:#0b6bcb;color:#fff;padding:10px 14px;border-radius:8px;text-decoration:none;display:inline-block}.site-footer{margin-top:40px;padding:24px 20px;text-align:center;background:#0b6bcb;color:#fff;font-size:14px;line-height:1.6}.site-footer strong{letter-spacing:.4px}.site-footer span{opacity:.8}</style></head><body><header><div><h1>TreasuresGod</h1><p>Lista de inscritos</p></div></header><main><p><a class="btn" href="/">← Volver a eventos</a></p><div class="box" id="list">Cargando...</div></main><script>const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));async function load(){const id=new URLSearchParams(location.search).get('evento');if(!id){document.querySelector('#list').innerHTML='<p>Evento no especificado.</p>';return}try{const r=await fetch('/api/public-list?evento='+encodeURIComponent(id));const d=await r.json();if(!r.ok){document.querySelector('#list').innerHTML='<p>'+esc(d.error)+'</p>';return}let html='<h2>'+esc(d.event.name)+'</h2>'+ (d.event.comment?'<p class="muted">📝 '+esc(d.event.comment)+'</p>':'') +'<p><strong>'+d.total+'</strong> inscritos · Capacidad: <strong>'+d.event.capacity+'</strong></p>';if(d.total<Number(d.event.capacity))html+='<p class="muted">Aún hay '+(Number(d.event.capacity)-d.total)+' cupos disponibles.</p>';if(!d.registrations.length){html+='<p class="muted">Todavía no hay inscritos.</p>'}else{html+='<div style="overflow-x:auto"><table class="table"><thead><tr><th>Nombre</th><th>Edad</th><th>Nivel</th><th>Categoría</th></tr></thead><tbody>'+d.registrations.map((x,i)=>'<tr><td><strong>'+(i+1)+'.</strong> '+esc(x.name)+'</td><td>'+esc(x.age??'—')+'</td><td>'+esc(x.level??'—')+'</td><td>'+esc(x.category??'—')+'</td></tr>').join('')+'</tbody></table></div>'}document.querySelector('#list').innerHTML=html}catch(e){document.querySelector('#list').innerHTML='<p>No se pudo cargar la lista.</p>'}}load();</script><footer class="site-footer"><strong>TREASURESGOD SPORTING VOLEY CLUB®</strong><br><span>TREASURESGOD · © 2026</span></footer></body></html>

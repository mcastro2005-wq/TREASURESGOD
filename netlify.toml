[build]
  publish = "public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/events"
  to = "/.netlify/functions/events"
  status = 200

[[redirects]]
  from = "/api/register"
  to = "/.netlify/functions/register"
  status = 200

[[redirects]]
  from = "/api/login"
  to = "/.netlify/functions/login"
  status = 200

[[redirects]]
  from = "/api/logout"
  to = "/.netlify/functions/logout"
  status = 200

[[redirects]]
  from = "/api/admin"
  to = "/.netlify/functions/admin"
  status = 200

[[redirects]]
  from = "/api/event-photo"
  to = "/.netlify/functions/event-photo"
  status = 200

[[redirects]]
  from = "/api/public-list"
  to = "/.netlify/functions/public-list"
  status = 200

[[redirects]]
  from = "/api/push-test"
  to = "/.netlify/functions/push-test"
  status = 200

[[redirects]]
  from = "/api/settings"
  to = "/.netlify/functions/settings"
  status = 200

[[redirects]]
  from = "/api/members"
  to = "/.netlify/functions/members"
  status = 200

[[redirects]]
  from = "/api/member-photo"
  to = "/.netlify/functions/member-photo"
  status = 200

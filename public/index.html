<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TreasuresGod | Eventos deportivos</title><style>
*{box-sizing:border-box}body{font-family:Arial,sans-serif;margin:0;background:#f5f7fb;color:#172033}header{background:linear-gradient(135deg,#0759a8,#0b6bcb);color:#fff;padding:32px 20px}header .hero{max-width:1100px;margin:auto}header h1{margin:0 0 8px;font-size:34px}header p{margin:0;opacity:.92}.top-actions{margin-top:18px;display:flex;gap:10px;flex-wrap:wrap}.top-actions a{background:#fff;color:#0759a8}.top-actions a,.btn{padding:11px 16px;border-radius:8px;text-decoration:none;font-weight:700;display:inline-block}.btn{background:#0b6bcb;color:#fff;border:0;cursor:pointer;position:relative;z-index:2;touch-action:manipulation;-webkit-tap-highlight-color:rgba(0,0,0,.08)}.btn.alt{background:#eaf3ff;color:#0759a8}.btn.whatsapp{background:#128c4a;color:#fff}.btn.disabled{background:#8b95a7;pointer-events:none}.main{max-width:1100px;margin:auto;padding:25px 20px}.section-title{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}.card{background:#fff;border-radius:14px;box-shadow:0 3px 14px #0001;overflow:hidden}.event-photo{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;background:#e8edf4}.placeholder{aspect-ratio:1/1;background:linear-gradient(135deg,#dbeafe,#eef2ff);display:flex;align-items:center;justify-content:center;font-size:52px}.card-body{padding:18px 20px 20px}.card h3{margin:0 0 10px}.meta{line-height:1.65}.price{font-size:19px;font-weight:700}.availability{display:inline-block;margin:6px 0 14px;padding:7px 10px;border-radius:999px;font-size:13px;font-weight:700;background:#eaf8ee;color:#16723a}.availability.warn{background:#fff4df;color:#8a5a00}.availability.danger{background:#fdecec;color:#a11b1b}.actions{display:flex;gap:8px;flex-wrap:wrap}.muted{color:#667085}.site-footer{margin-top:40px;padding:24px 20px;text-align:center;background:#101827;color:#fff;font-size:14px;line-height:1.6}.site-footer strong{letter-spacing:.4px}.site-footer span{opacity:.8}@media(max-width:600px){header h1{font-size:29px}}
.comment{margin-top:8px;padding:9px 11px;background:#f7faff;border-left:3px solid #0b6bcb;border-radius:6px;color:#42526b}.price{font-weight:700;color:#0759a8}</style></head><body><header><div class="hero"><h1>TreasuresGod</h1><p>Eventos deportivos y actividades para toda la familia</p><div class="top-actions"><a href="#eventos">🏆 Ver eventos</a><a href="/admin.html">🔐 Administración</a></div></div></header><main class="main"><div class="section-title"><h2 id="eventos">Próximos eventos</h2><span class="muted" id="summary"></span></div><div id="events" class="grid">Cargando eventos...</div></main><script>
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
function eventState(e){const d=new Date(e.date+'T23:59:59');const today=new Date();today.setHours(0,0,0,0);if(d<today)return ['Finalizado','danger'];if(e.remaining<=0)return ['Agotado','danger'];if(e.remaining<=Math.max(3,Math.ceil(Number(e.capacity)*.2)))return [`Quedan ${e.remaining} cupo${e.remaining===1?'':'s'}`,'warn'];return [`${e.remaining} cupos disponibles`,''];}
function wa(e){const text=`Hola, quiero información sobre ${e.name}. Fecha: ${e.date}, ${e.time} a ${e.timeEnd||''}, lugar: ${e.location}. Donación sugerida: S/ ${Number(e.price).toFixed(2)}.`;return 'https://wa.me/?text='+encodeURIComponent(text)}
async function load(){try{const r=await fetch('/api/events');const es=await r.json();const active=es.filter(e=>e.active!==false);document.querySelector('#summary').textContent=active.length?`${active.length} evento${active.length===1?'':'s'} publicado${active.length===1?'':'s'}`:'';document.querySelector('#events').innerHTML=active.map(e=>{const [state,cls]=eventState(e);const can=state!=='Finalizado'&&state!=='Agotado';return `<article class="card">${e.photoKey?`<img class="event-photo" src="/api/event-photo?event=${encodeURIComponent(e.id)}&v=${encodeURIComponent(e.photoKey)}" alt="${esc(e.name)}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"> <div class="placeholder" style="display:none">🏅</div>`:'<div class="placeholder">🏅</div>'}<div class="card-body"><h3>${esc(e.name)}</h3><div class="meta"><div>📅 ${esc(e.date)}</div><div>⏰ ${esc(e.time)} a ${esc(e.timeEnd||'')}</div><div>📍 ${esc(e.location)}</div><div class="price">💙 Donación sugerida: S/ ${Number(e.price).toFixed(2)}</div>${e.comment?`<div class="comment">📝 ${esc(e.comment)}</div>`:''}</div><span class="availability ${cls}">${state}</span><div class="actions">${can?`<a class="btn signup-link" href="${location.origin}/registro.html?evento=${encodeURIComponent(e.id)}" data-evento="${encodeURIComponent(e.id)}">Inscribirme</a>`:`<span class="btn disabled">${state}</span>`}<a class="btn alt" href="/lista.html?evento=${encodeURIComponent(e.id)}">Ver lista</a><a class="btn whatsapp" target="_blank" rel="noopener" href="${wa(e)}">WhatsApp</a></div></div></article>`}).join('')||'<p>No hay eventos publicados.</p>'}catch(err){document.querySelector('#events').innerHTML='<p>No se pudieron cargar los eventos.</p>'}}load();
// Compatibilidad iPhone/Safari y navegadores internos de WhatsApp.
document.addEventListener('click',function(ev){var a=ev.target.closest&&ev.target.closest('a.signup-link');if(!a)return;var href=a.getAttribute('href');if(href){ev.preventDefault();window.location.assign(href);}},false);
</script><footer class="site-footer"><strong>TREASURESGOD SPORTING VOLEY CLUB®</strong><br><span>TREASURESGOD · © 2026</span></footer></body></html>

<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inscripción | TreasuresGod</title><style>body{font-family:Arial;background:#f5f7fb;margin:0;color:#172033}.wrap{max-width:700px;margin:30px auto;background:#fff;padding:25px;border-radius:14px;box-shadow:0 4px 18px #0001}label{display:block;margin-top:14px;font-weight:600}input,select{width:100%;padding:11px;margin-top:6px;box-sizing:border-box;border:1px solid #ccd3df;border-radius:8px}button{margin-top:20px;padding:12px 18px;background:#0b6bcb;color:white;border:0;border-radius:8px;cursor:pointer}.pay{margin:18px 0;padding:15px;border-radius:10px;background:#eef6ff;border:1px solid #c9e1ff}.pay strong{display:block;margin-bottom:7px}.ok{padding:14px;background:#eaf8ee;border:1px solid #b9dfc2;border-radius:10px}.error{color:#b42318;font-weight:600}.muted{color:#667085}</style><style>.site-footer{margin-top:40px;padding:24px 20px;text-align:center;background:#101827;color:#fff;font-size:14px;line-height:1.6}.site-footer strong{letter-spacing:.4px}.site-footer span{opacity:.8}</style></head><body><div class="wrap"><h1>Inscripción</h1><p id="event" class="muted">Cargando evento...</p><div id="pay" class="pay" style="display:none"><strong>Pago de inscripción</strong><div>Yape / Plin: <b>965 633 776</b></div><div>Titular: <b>Milton Castro</b></div><div id="amount"></div></div><form id="f"><input type="hidden" name="eventId"><label>Nombre completo<input name="name" required></label><label>DNI<input name="dni" required></label><label>Teléfono<input name="phone" required></label><label>Correo<input name="email" type="email" required></label><label>Edad<input name="age" type="number" min="1" max="100" required></label><label>Nivel<select name="level" required><option value="">Selecciona tu nivel</option><option>Iniciación</option><option>Intermedio</option><option>Avanzado</option></select></label><label>Categoría<input name="category" required></label><label>Medio de pago<select name="paymentMethod"><option>Yape</option><option>Plin</option><option>Transferencia</option><option>Efectivo</option></select></label><label>Número de operación<input name="paymentReference" placeholder="Si ya pagaste, escribe el número de operación"></label><label>Comprobante de pago <span class="muted">(opcional)</span><input name="receipt" type="file" accept="image/jpeg,image/png,image/webp,application/pdf"><span class="muted">JPG, PNG, WEBP o PDF, máximo 5 MB.</span></label><button id="submit">Registrar inscripción</button></form><div id="msg"></div></div><script>const id=new URLSearchParams(location.search).get('evento');document.querySelector('[name=eventId]').value=id||'';let currentEvent=null;fetch('/api/events').then(r=>r.json()).then(es=>{currentEvent=es.find(x=>x.id===id);if(!currentEvent){document.querySelector('#event').textContent='Evento no encontrado';return}const countText='';document.querySelector('#event').textContent=`${currentEvent.name} — ${currentEvent.date} ${currentEvent.time} — ${currentEvent.location}`;document.querySelector('#amount').textContent=`Monto: S/ ${Number(currentEvent.price).toFixed(2)}`;document.querySelector('#pay').style.display='block';if(Number(currentEvent.capacity)<=0){document.querySelector('#submit').disabled=true;document.querySelector('#submit').textContent='Sin cupos'}}).catch(()=>document.querySelector('#event').textContent='No se pudo cargar el evento');document.querySelector('#f').onsubmit=async ev=>{ev.preventDefault();const btn=document.querySelector('#submit');btn.disabled=true;btn.textContent='Registrando...';const form=new FormData(ev.target);const r=await fetch('/api/register',{method:'POST',body:form});const j=await r.json();const msg=document.querySelector('#msg');if(r.ok){msg.className='ok';msg.innerHTML=`<b>¡Inscripción registrada!</b><br>Tu código es: <b>${j.code}</b><br>Conserva este código para consultar tu inscripción.`;ev.target.reset();document.querySelector('[name=eventId]').value=id}else{msg.className='error';msg.textContent=j.error||'No se pudo registrar'}btn.disabled=false;btn.textContent='Registrar inscripción'};</script><footer class="site-footer"><strong>TREASURESGOD SPORTING VOLEY CLUB®</strong><br><span>Marca registrada · © 2026</span></footer></body></html>

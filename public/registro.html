<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inscripción | TreasuresGod</title><style>*{box-sizing:border-box}body{font-family:Arial;background:#f5f7fb;margin:0;color:#172033}.wrap{max-width:700px;margin:30px auto;background:#fff;padding:25px;border-radius:14px;box-shadow:0 4px 18px #0001}.top{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}.btn{background:#0b6bcb;color:#fff;padding:10px 14px;border-radius:8px;text-decoration:none;display:inline-block}.event-card{margin:15px 0;padding:16px;border-radius:12px;background:#eef6ff;border:1px solid #c9e1ff}.pay{margin:18px 0;padding:15px;border-radius:10px;background:#eef6ff;border:1px solid #c9e1ff}.pay strong{display:block;margin-bottom:7px}label{display:block;margin-top:14px;font-weight:600}input,select{width:100%;padding:11px;margin-top:6px;box-sizing:border-box;border:1px solid #ccd3df;border-radius:8px}.row-fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}.row-fields label{margin-top:14px}.button{margin-top:20px;padding:12px 18px;background:#0b6bcb;color:white;border:0;border-radius:8px;cursor:pointer;font-weight:700}.ok{padding:16px;background:#eaf8ee;border:1px solid #b9dfc2;border-radius:10px}.error{padding:12px;color:#b42318;font-weight:600}.muted{color:#667085}.site-footer{margin-top:40px;padding:24px 20px;text-align:center;background:#0b6bcb;color:#fff;font-size:14px;line-height:1.6}.site-footer strong{letter-spacing:.4px}.site-footer span{opacity:.8}@media(max-width:600px){.row-fields{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="top"><h1>Inscripción</h1><a class="btn" href="/">← Eventos</a></div><div id="event" class="event-card">Cargando evento...</div><div id="pay" class="pay" style="display:none"><strong>💳 Pago de inscripción</strong><div>Yape / Plin: <b>965 633 776</b></div><div>Titular: <b>Milton Castro</b></div><div id="amount"></div></div><form id="f"><input type="hidden" name="eventId"><label>Nombre completo<input name="name" required></label><div class="row-fields"><label>DNI<input name="dni" required></label><label>Teléfono<input name="phone" required></label></div><label>Correo<input name="email" type="email" required></label><div class="row-fields"><label>Edad<input name="age" type="number" min="1" max="100" required></label><label>Nivel<select name="level" required><option value="">Selecciona tu nivel</option><option>Básico</option><option>Intermedio</option><option>Avanzado</option></select></label></div><label>Categoría <span class="muted">(automática según edad)</span><input name="category" id="category" readonly required placeholder="Se asigna al ingresar la edad"></label><label>Medio de pago<select name="paymentMethod"><option>Yape</option><option>Plin</option><option>Transferencia</option><option>Efectivo</option></select></label><label>Número de operación<input name="paymentReference" placeholder="Si ya pagaste, escribe el número de operación"></label><label>Comprobante de pago <span class="muted">(opcional)</span><input name="receipt" type="file" accept="image/jpeg,image/png,image/webp,application/pdf"><span class="muted">JPG, PNG, WEBP o PDF, máximo 5 MB.</span></label><button class="button" id="submit">Registrar inscripción</button></form><div id="msg"></div></div><script>function categoriaPorEdad(edad){const n=Number(edad);if(!n)return '';return n<=29?'Junior':n<=39?'Senior':'Master'}
document.querySelector('[name=age]').addEventListener('input',e=>{document.querySelector('[name=category]').value=categoriaPorEdad(e.target.value)});
const id=new URLSearchParams(location.search).get('evento');document.querySelector('[name=eventId]').value=id||'';let currentEvent=null;const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));fetch('/api/events').then(r=>r.json()).then(es=>{currentEvent=es.find(x=>x.id===id);const box=document.querySelector('#event');if(!currentEvent){box.textContent='Evento no encontrado';return}box.innerHTML=`<strong>🏆 ${esc(currentEvent.name)}</strong><br>📅 ${esc(currentEvent.date)} · ⏰ ${esc(currentEvent.time)} a ${esc(currentEvent.timeEnd||'')}<br>📍 ${esc(currentEvent.location)}${currentEvent.comment?`<br>📝 ${esc(currentEvent.comment)}`:''}<br>👥 Quedan <strong>${currentEvent.remaining}</strong> de ${currentEvent.capacity} cupos`;document.querySelector('#amount').textContent=`Donación sugerida: S/ ${Number(currentEvent.price).toFixed(2)}`;document.querySelector('#pay').style.display='block';if(Number(currentEvent.remaining)<=0){document.querySelector('#submit').disabled=true;document.querySelector('#submit').textContent='Cupos agotados'}}).catch(()=>document.querySelector('#event').textContent='No se pudo cargar el evento');document.querySelector('#f').onsubmit=async ev=>{ev.preventDefault();const btn=document.querySelector('#submit');btn.disabled=true;btn.textContent='Registrando...';const form=new FormData(ev.target);const r=await fetch('/api/register',{method:'POST',body:form});const j=await r.json();const msg=document.querySelector('#msg');if(r.ok){msg.className='ok';msg.innerHTML=`<b>¡Inscripción registrada!</b><br><br>Tu código es: <b>${esc(j.code)}</b><br>Te quedan <b>${j.remaining}</b> cupos disponibles en este evento.<br><br><a class="btn" target="_blank" rel="noopener" href="https://wa.me/?text=${encodeURIComponent('Hola, me inscribí en '+(currentEvent?.name||'TreasuresGod')+' con el código '+j.code)}">Compartir por WhatsApp</a>`;ev.target.reset();document.querySelector('[name=eventId]').value=id}else{msg.className='error';msg.textContent=j.error||'No se pudo registrar'}btn.disabled=false;btn.textContent='Registrar inscripción'};</script><footer class="site-footer"><strong>TREASURESGOD SPORTING VOLEY CLUB®</strong><br><span>TREASURESGOD · © 2026</span></footer></body></html>

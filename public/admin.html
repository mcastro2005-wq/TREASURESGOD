<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | TreasuresGod</title><style>body{font-family:Arial;background:#f1f5f9;margin:0}.wrap{max-width:1200px;margin:auto;padding:25px}.panel{background:#fff;padding:20px;border-radius:14px;margin:15px 0;box-shadow:0 5px 20px #0001}input{padding:10px;margin:4px;border:1px solid #cbd5e1;border-radius:8px}button{padding:9px 13px;border:0;border-radius:8px;cursor:pointer;background:#2563eb;color:#fff}.danger{background:#dc2626}.ok{background:#16a34a}table{width:100%;border-collapse:collapse}td,th{padding:9px;border-bottom:1px solid #e2e8f0;text-align:left}.hidden{display:none}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.stat{background:#eef2ff;padding:18px;border-radius:12px}</style></head><body><div class="wrap"><h1>🔐 Panel TreasuresGod</h1><section id="login" class="panel"><h2>Acceso</h2><input id="pw" type="password" placeholder="Contraseña"><button onclick="doLogin()">Ingresar</button><p id="msg"></p></section><section id="dash" class="hidden"><div class="grid"><div class="stat">Inscritos <b id="total">0</b></div><div class="stat">Pagados <b id="paid">0</b></div><div class="stat">Pendientes <b id="pending">0</b></div></div><div class="panel"><h2>Crear / editar evento</h2><input id="eid" placeholder="ID (ej. TG-004)"><input id="ename" placeholder="Nombre"><input id="edate" type="date"><input id="etime" type="time"><input id="eloc" placeholder="Lugar"><input id="ecap" type="number" placeholder="Capacidad"><input id="eprice" type="number" placeholder="Precio"><input id="edesc" placeholder="Descripción"><button onclick="saveEvent()">Guardar evento</button> <button onclick="clearForm()">Nuevo</button></div><div class="panel"><h2>Eventos</h2><div id="events"></div></div><div class="panel"><h2>Inscritos y pagos</h2><div style="overflow:auto"><table><thead><tr><th>Código</th><th>Nombre</th><th>Evento</th><th>Pago</th><th>Acciones</th></tr></thead><tbody id="regs"></tbody></table></div></div><button class="danger" onclick="logout()">Cerrar sesión</button></section></div><script>let data={events:[],registrations:[]};async function doLogin(){const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:pw.value})});if(r.ok){login.classList.add('hidden');dash.classList.remove('hidden');load()}else msg.textContent='Contraseña incorrecta'}async function load(){const r=await fetch('/api/admin');if(!r.ok)return;data=await r.json();total.textContent=data.registrations.length;paid.textContent=data.registrations.filter(x=>x.paymentStatus==='Pagado').length;pending.textContent=data.registrations.filter(x=>x.paymentStatus!=='Pagado').length;events.innerHTML=data.events.map(e=>`<div style="padding:10px;border-bottom:1px solid #ddd"><b>${e.name}</b> — ${e.date} ${e.time} — S/ ${e.price} <button onclick='editEvent(${JSON.stringify(e)})'>Editar</button> <button class="danger" onclick="delEvent('${e.id}')">Eliminar</button></div>`).join('');regs.innerHTML=data.registrations.map(r=>`<tr><td>${r.code}</td><td>${r.name}</td><td>${r.eventId}</td><td>${r.paymentStatus}</td><td><button class="ok" onclick="pay('${r.code}','Pagado')">Pagado</button> <button onclick="pay('${r.code}','Pendiente')">Pendiente</button> <button class="danger" onclick="delReg('${r.code}')">Eliminar</button></td></tr>`).join('')}function editEvent(e){eid.value=e.id;ename.value=e.name;edate.value=e.date;etime.value=e.time;eloc.value=e.location;ecap.value=e.capacity;eprice.value=e.price;edesc.value=e.description||''}function clearForm(){['eid','ename','edate','etime','eloc','ecap','eprice','edesc'].forEach(x=>document.getElementById(x).value='')}async function saveEvent(){const b={id:eid.value,name:ename.value,date:edate.value,time:etime.value,location:eloc.value,capacity:ecap.value,price:eprice.value,description:edesc.value};await fetch('/api/events',{method:data.events.some(x=>x.id===b.id)?'PUT':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});clearForm();load()}async function delEvent(id){if(confirm('¿Eliminar evento?')){await fetch('/api/events?id='+encodeURIComponent(id),{method:'DELETE'});load()}}async function pay(code,status){await fetch('/api/admin',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({code,paymentStatus:status})});load()}async function delReg(code){if(confirm('¿Eliminar inscripción?')){await fetch('/api/admin?code='+encodeURIComponent(code),{method:'DELETE'});load()}}async function logout(){await fetch('/api/logout',{method:'POST'});location.reload()}</script></body></html>

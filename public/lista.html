<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lista de inscritos | TreasuresGod</title><style>body{font-family:Arial;margin:0;background:#f5f7fb;color:#172033}header{background:#101827;color:#fff;padding:24px 20px}main{max-width:900px;margin:auto;padding:24px}.box{background:#fff;border-radius:14px;padding:20px;box-shadow:0 3px 14px #0001}.row{display:flex;justify-content:space-between;gap:12px;padding:13px 0;border-bottom:1px solid #e5e7eb}.muted{color:#667}a{color:#0b6bcb}</style><style>.site-footer{margin-top:40px;padding:24px 20px;text-align:center;background:#101827;color:#fff;font-size:14px;line-height:1.6}.site-footer strong{letter-spacing:.4px}.site-footer span{opacity:.8}</style></head><body><header><h1>TreasuresGod</h1><p>Lista de inscritos</p></header><main><p><a href="/">← Volver a eventos</a></p><div class="box" id="list">Cargando...</div></main><script>async function load(){const id=new URLSearchParams(location.search).get('evento');if(!id){document.querySelector('#list').innerHTML='<p>Evento no especificado.</p>';return}const r=await fetch('/api/public-list?evento='+encodeURIComponent(id));const d=await r.json();if(!r.ok){document.querySelector('#list').innerHTML='<p>'+d.error+'</p>';return}let html='<h2>'+d.event.name+'</h2><p><strong>'+d.total+'</strong> inscritos</p>';if(!d.registrations.length){html+='<p class="muted">Todavía no hay inscritos.</p>'}else{html+='<div>'+d.registrations.map((x,i)=>'<div class="row"><span><strong>'+(i+1)+'.</strong> '+x.name+'</span><span class="muted">Edad: '+(x.age ?? '—')+' · Nivel: '+(x.level ?? '—')+' · '+x.category+'</span></div>').join('')+'</div>'}document.querySelector('#list').innerHTML=html}load();</script><footer class="site-footer"><strong>TREASURESGOD SPORTING VOLEY CLUB®</strong><br><span>Marca registrada · © 2026</span></footer></body></html>

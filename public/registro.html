<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inscripción | TreasuresGod</title><style>body{font-family:Arial;background:#f5f7fb;margin:0}.wrap{max-width:700px;margin:30px auto;background:#fff;padding:25px;border-radius:14px}label{display:block;margin-top:14px}input,select{width:100%;padding:11px;margin-top:6px;box-sizing:border-box}button{margin-top:20px;padding:12px 18px;background:#0b6bcb;color:white;border:0;border-radius:8px}</style></head><body><div class="wrap"><h1>Inscripción</h1><p id="event"></p><form id="f"><input type="hidden" name="eventId"><label>Nombre completo<input name="name" required></label><label>DNI<input name="dni" required></label><label>Teléfono<input name="phone" required></label><label>Correo<input name="email" type="email" required></label><label>Categoría<input name="category" required></label><label>Medio de pago<select name="paymentMethod"><option>Yape</option><option>Plin</option><option>Transferencia</option><option>Efectivo</option></select></label><label>Referencia de pago<input name="paymentReference" placeholder="Opcional"></label><button>Enviar inscripción</button></form><p id="msg"></p></div><script>const id=new URLSearchParams(location.search).get('evento');document.querySelector('[name=eventId]').value=id||'';fetch('/api/events').then(r=>r.json()).then(es=>{const e=es.find(x=>x.id===id);document.querySelector('#event').textContent=e?`${e.name} — ${e.date} ${e.time} — S/ ${e.price}`:'Evento no encontrado'});document.querySelector('#f').onsubmit=async ev=>{ev.preventDefault();const data=Object.fromEntries(new FormData(ev.target));const r=await fetch('/api/register',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(data)});const j=await r.json();document.querySelector('#msg').textContent=r.ok?`Inscripción registrada. Código: ${j.code}`:(j.error||'Error');if(r.ok)ev.target.reset()};</script></body></html>

<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TreasuresGod Sporting Voley Club</title>
<meta property="og:title" content="TREASURESGOD SPORTING VOLEY CLUB"><meta property="og:description" content="Se abrieron las inscripciones. ¡Asegura tu cupo!"><meta property="og:image" content="https://treasuresgod.netlify.app/treasuresgod-inscripciones.png"><meta property="og:url" content="https://treasuresgod.netlify.app/"><meta property="og:type" content="website">
<style>*{box-sizing:border-box}body{font-family:Arial,sans-serif;margin:0;background:#f5f7fb;color:#172033}header{background:linear-gradient(135deg,#0759a8,#0b6bcb);color:#fff;padding:32px 20px}.hero,.main{max-width:1100px;margin:auto}.brand{display:flex;align-items:center;gap:16px}.logo{width:96px;height:96px;object-fit:contain;background:#fff;border-radius:50%;padding:4px}h1{margin:0}.main{padding:25px 20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}.card{background:#fff;border-radius:14px;box-shadow:0 3px 14px #0001;overflow:hidden}.photo{width:100%;aspect-ratio:1/1;object-fit:cover;background:#e8edf4}.placeholder{aspect-ratio:1/1;display:flex;align-items:center;justify-content:center;font-size:52px;background:#eef3f9}.body{padding:18px 20px}.meta{line-height:1.7}.price{font-weight:700;font-size:18px}.availability{font-weight:800;margin-top:10px}.progress{height:14px;background:#e5e7eb;border-radius:999px;overflow:hidden;margin:8px 0}.progress>span{display:block;height:100%;background:#0b6bcb;border-radius:999px;transition:width .4s}.progress>span.near{background:#f59e0b}.progress>span.full{background:#dc2626}.progress-note{font-size:13px;color:#667085}.status{display:inline-block;padding:6px 10px;border-radius:999px;font-weight:800;font-size:12px;margin:8px 0}.programado{background:#eaf8ee;color:#16723a}.confirmar{background:#fff4df;color:#8a5a00}.suspendido,.cancelado{background:#fdecec;color:#a11b1b}.realizado{background:#eef2f6;color:#344054}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.btn{padding:11px 15px;border-radius:8px;background:#0b6bcb;color:#fff;text-decoration:none;font-weight:800}.btn.info{background:#128c4a}.btn.disabled{background:#8b95a7;pointer-events:none}.rules-panel{white-space:pre-wrap;background:#fff;border:1px solid #dbe4ef;border-radius:12px;padding:18px;margin:12px 0 22px;line-height:1.7;font-weight:700;font-size:17px}.rules-toggle{border:0;cursor:pointer}.top-actions{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 12px}.admin-btn{background:#344054}.site-footer{margin-top:40px;padding:24px 20px;text-align:center;background:#0b6bcb;color:#fff}.footer-logo{width:70px;height:70px;object-fit:contain;background:#fff;border-radius:50%;padding:3px;margin-bottom:7px}@media(max-width:600px){.logo{width:74px;height:74px}.brand h1{font-size:27px}} .wa-icon{width:21px;height:21px;vertical-align:-5px;margin-right:6px;color:#fff}</style></head><body>
<header><div class="hero"><div class="brand"><img class="logo" src="/logo-treasuresgod.png" alt="Logo TreasuresGod"><div><h1 id="clubName">TREASURESGOD SPORTING VOLEY CLUB</h1><div>Eventos deportivos</div></div></div><p>Eventos deportivos · Vóley · Carrera · Caminata</p></div></header>
<main class="main"><h2>Eventos deportivos</h2><p id="summary"></p><div class="top-actions"><button id="generalRulesBtn" class="btn rules-toggle" type="button" onclick="toggleGeneralRules()">📘 REGLAS GENERALES</button><a class="btn" href="/miembro.html">👥 INSCRIBIRME AL GRUPO</a><a class="btn admin-btn" href="/admin.html">🔐 ADMINISTRACIÓN</a></div><div id="generalRulesPanel" class="rules-panel" style="display:none"></div><div id="events" class="grid">Cargando…</div></main>
<footer class="site-footer"><img class="footer-logo" src="/logo-treasuresgod.png" alt="Logo TreasuresGod"><br><strong>TREASURESGOD SPORTING VOLEY CLUB®</strong><br>TREASURESGOD · © 2026</footer>
<script>
const esc=s=>String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
function fecha(v){if(!/^\d{4}-\d{2}-\d{2}$/.test(v||''))return v||'';const [y,m,d]=v.split('-');return `${d}/${m}/${y}`}
function wa(e){const t=`Hola, deseo informes sobre ${e.name}. Fecha: ${fecha(e.date)}, ${e.time}${e.timeEnd?' a '+e.timeEnd:''}, lugar: ${e.location}.`;return 'https://wa.me/?text='+encodeURIComponent(t)}
let publicSettings={generalRules:''};function toggleGeneralRules(){const p=document.getElementById('generalRulesPanel');p.innerHTML='<div style="font-weight:800;font-size:19px;margin-bottom:10px">📘 REGLAS GENERALES DEL GRUPO</div><div>'+esc(publicSettings.generalRules||'Las reglas generales todavía no han sido publicadas.')+'</div>';p.style.display=p.style.display==='none'?'block':'none'}
function statusClass(s){return s==='Por confirmar'?'confirmar':s==='Suspendido por falta de quórum'?'suspendido':s==='Cancelado'?'cancelado':s==='Realizado'?'realizado':'programado'}
async function load(){try{const sr=await fetch('/api/settings');if(sr.ok){const st=await sr.json();publicSettings=st;document.getElementById('clubName').textContent=st.clubName||'TREASURESGOD SPORTING VOLEY CLUB';document.title=(st.clubName||'TREASURESGOD SPORTING VOLEY CLUB');}const r=await fetch('/api/events');const es=await r.json();const active=es.filter(e=>e.active!==false);summary.textContent=active.length?`${active.length} evento${active.length===1?'':'s'} publicado${active.length===1?'':'s'}`:'';events.innerHTML=active.map(e=>{const cap=Number(e.capacity)||0,reg=Number(e.registered)||0,rem=Math.max(0,cap-reg),pct=cap?Math.min(100,Math.round(reg*100/cap)):0;const st=e.status||'Programado';const closed=['Suspendido por falta de quórum','Cancelado','Realizado'].includes(st)||rem<=0||new Date(e.date+'T23:59:59')<new Date();const bar=pct>=100?'full':pct>=75?'near':'';return `<article class="card">${e.photoKey?`<img class="photo" src="/api/event-photo?event=${encodeURIComponent(e.id)}&v=${encodeURIComponent(e.photoKey)}" alt="${esc(e.name)}">`:'<div class="placeholder">🏐</div>'}<div class="body"><h3>${esc(String(e.name).toUpperCase())}</h3><div class="meta"><div>📅 ${fecha(e.date)}</div><div>⏰ ${esc(e.time)}${e.timeEnd?' a '+esc(e.timeEnd):''}</div><div>📍 <strong>${esc(String(e.location).toUpperCase())}</strong></div><div class="price">💙 Donación sugerida: S/ ${Number(e.price||0).toFixed(2)}</div>${e.comment?`<div>📝 ${esc(e.comment)}</div>`:''}</div><div class="status ${statusClass(st)}">${st==='Suspendido por falta de quórum'?'🔴 ':st==='Por confirmar'?'🟡 ':st==='Programado'?'🟢 ':st==='Realizado'?'✅ ':'⚫ '}${esc(st)}</div><div class="availability">👥 ${rem} cupo${rem===1?'':'s'} disponible${rem===1?'':'s'} de ${cap}</div><div class="progress"><span class="${bar}" style="width:${pct}%"></span></div><div class="progress-note">${reg} inscritos · ${pct}% ocupado</div><div class="actions">${closed?`<span class="btn disabled">${rem<=0?'🔒 EVENTO COMPLETO':'INSCRIPCIÓN CERRADA'}</span>`:`<a class="btn" href="/registro.html?evento=${encodeURIComponent(e.id)}">INSCRIBIRME</a>`}<a class="btn" href="/lista.html?evento=${encodeURIComponent(e.id)}">VER LISTA</a><a class="btn info" target="_blank" rel="noopener" href="${wa(e)}"><svg class="wa-icon" viewBox="0 0 32 32" aria-hidden="true"><path fill="currentColor" d="M16 3a12.8 12.8 0 0 0-11 19.3L3.5 29l6.9-1.4A12.9 12.9 0 1 0 16 3Zm0 23.4c-1.9 0-3.7-.5-5.3-1.4l-.4-.2-4.1.9.9-4-.3-.4A10.5 10.5 0 1 1 16 26.4Zm5.8-7.9c-.3-.2-1.9-.9-2.2-1-.3-.1-.5-.2-.7.2-.2.3-.8 1-.9 1.2-.2.2-.3.2-.7.1-1.8-.9-3-1.6-4.2-3.7-.3-.6.3-.6.9-1.3.1-.2.2-.3.3-.5.1-.2.1-.4 0-.6-.1-.2-.7-1.7-1-2.4-.3-.6-.6-.5-.8-.5h-.7c-.2 0-.6.1-.9.4-.3.3-1.2 1.2-1.2 2.9s1.3 3.4 1.4 3.6c.2.2 2.5 3.8 6 5.3 2.2.9 3 .9 4.1.8.7-.1 1.9-.8 2.2-1.5.3-.7.3-1.3.2-1.5-.1-.1-.3-.2-.6-.4Z"/></svg> INFORMES</a></div></div></article>`}).join('')||'<p>No hay eventos publicados.</p>'}catch(e){events.innerHTML='<p>No se pudieron cargar los eventos.</p>'}}load();
</script></body></html>

<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TreasuresGod | Eventos deportivos</title><style>body{font-family:Arial;margin:0;background:#f5f7fb;color:#172033}header{background:#101827;color:#fff;padding:28px 20px}main{max-width:1100px;margin:auto;padding:25px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}.card{background:#fff;padding:0 0 20px;border-radius:14px;box-shadow:0 3px 14px #0001;overflow:hidden}.card-body{padding:0 20px}.event-photo{width:100%;height:190px;object-fit:cover;display:block;background:#e8edf4}.placeholder{height:190px;background:linear-gradient(135deg,#dbeafe,#eef2ff);display:flex;align-items:center;justify-content:center;font-size:52px}button,a.btn{background:#0b6bcb;color:#fff;border:0;padding:11px 16px;border-radius:8px;text-decoration:none;cursor:pointer;display:inline-block}small{color:#667}.muted{color:#667}</style><style>.site-footer{margin-top:40px;padding:24px 20px;text-align:center;background:#101827;color:#fff;font-size:14px;line-height:1.6}.site-footer strong{letter-spacing:.4px}.site-footer span{opacity:.8}</style></head><body><header><h1>TreasuresGod</h1><p>Eventos deportivos y actividades para toda la familia</p></header><main><h2>Próximos eventos</h2><div id="events" class="grid">Cargando...</div><p><a href="/admin.html">Administración</a></p></main><script>async function load(){const r=await fetch('/api/events');const es=await r.json();document.querySelector('#events').innerHTML=es.filter(e=>e.active!==false).map(e=>`<article class="card">${e.photoKey?`<img class="event-photo" src="/api/event-photo?event=${encodeURIComponent(e.id)}&v=${encodeURIComponent(e.photoKey)}" alt="${e.name}" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'"><div class="placeholder" style="display:none">🏅</div>`:'<div class="placeholder">🏅</div>'}<div class="card-body"><h3>${e.name}</h3><p>📅 ${e.date} · ⏰ ${e.time} a ${e.timeEnd || ''}</p><p>📍 ${e.location}</p><p>Cupos: ${e.remaining} de ${e.capacity} · Precio: S/ ${Number(e.price).toFixed(2)}</p>${e.remaining>0?`<a class="btn" href="/registro.html?evento=${encodeURIComponent(e.id)}">Inscribirme</a>`:`<span class="muted">Cupos agotados</span>`} <a class="btn" href="/lista.html?evento=${encodeURIComponent(e.id)}" style="margin-left:6px">Ver lista</a></div></article>`).join('')||'<p>No hay eventos publicados.</p>'}load();</script><footer class="site-footer"><strong>TREASURESGOD SPORTING VOLEY CLUB®</strong><br><span>TREASURESGOD · © 2026</span></footer></body></html>

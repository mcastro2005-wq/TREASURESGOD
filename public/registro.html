<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inscripción | TreasuresGod</title><style>body{font-family:Arial;background:#f4f7fb;margin:0}.box{max-width:650px;margin:40px auto;background:#fff;padding:28px;border-radius:16px;box-shadow:0 8px 25px #0001}input,select{width:100%;box-sizing:border-box;padding:12px;margin:7px 0 15px;border:1px solid #cbd5e1;border-radius:9px}.btn{background:#2563eb;color:#fff;border:0;padding:13px 20px;border-radius:9px;cursor:pointer}</style></head><body><div class="box"><h1>📝 Inscripción TreasuresGod</h1><form id="f"><label>Evento</label><input id="eventId" name="eventId" readonly><label>Nombre completo</label><input name="name" required><label>DNI</label><input name="dni" required><label>Teléfono</label><input name="phone" required><label>Email</label><input name="email" type="email" required><label>Categoría</label><input name="category" placeholder="Ej. Libre"><label>Método de pago</label><select name="paymentMethod"><option>Yape</option><option>Plin</option><option>Transferencia</option><option>Efectivo</option></select><label>Referencia de pago</label><input name="paymentReference" placeholder="Número de operación, opcional"><button class="btn">Enviar inscripción</button></form><p id="msg"></p></div><script>const id=new URLSearchParams(location.search).get('evento');eventId.value=id||'';f.onsubmit=async e=>{e.preventDefault();const b=Object.fromEntries(new FormData(f));const r=await fetch('/api/register',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)});const x=await r.json();msg.textContent=r.ok?`Inscripción registrada. Código: ${x.code}`:(x.error||'Error');if(r.ok)f.reset()};</script></body></html>

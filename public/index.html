<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TreasuresGod | Eventos deportivos</title><style>body{font-family:Arial;margin:0;background:#f5f7fb;color:#172033}header{background:#101827;color:#fff;padding:28px 20px}main{max-width:1100px;margin:auto;padding:25px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:18px}.card{background:#fff;padding:20px;border-radius:14px;box-shadow:0 3px 14px #0001}button,a.btn{background:#0b6bcb;color:#fff;border:0;padding:11px 16px;border-radius:8px;text-decoration:none;cursor:pointer;display:inline-block}small{color:#667}</style></head><body><header><h1>TreasuresGod</h1><p>Eventos deportivos y actividades para toda la familia</p></header><main><h2>Próximos eventos</h2><div id="events" class="grid">Cargando...</div><p><a href="/admin.html">Administración</a></p></main><script>async function load(){const r=await fetch('/api/events');const es=await r.json();document.querySelector('#events').innerHTML=es.filter(e=>e.active!==false).map(e=>`<article class="card"><h3>${e.name}</h3><p>📅 ${e.date} · ⏰ ${e.time}</p><p>📍 ${e.location}</p><p>Capacidad: ${e.capacity} · Precio: S/ ${Number(e.price).toFixed(2)}</p><a class="btn" href="/registro.html?evento=${encodeURIComponent(e.id)}">Inscribirme</a></article>`).join('')||'<p>No hay eventos publicados.</p>'}load();</script></body></html>
